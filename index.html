<h1>가계부</h1><div class="mu">2026-11-03부터 시작 · 금액은 원 단위 · 입력하면 자동 저장됩니다</div>

<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"),won=v=>Math.round(v||0).toLocaleString("ko-KR");
const B=n=>Array.from({length:n},()=>({})),L=s=>String(s||"").split(",").map(x=>x.trim()).filter(Boolean);

const named=()=>D.accts.filter(a=>a.name&&a.id),byId=id=>D.accts.find(a=>a.id==id),isDebt=id=>(byId(id)||{}).type=="부채";
const OS={names:()=>D.basic.map(b=>b.name).filter(Boolean).concat(["공동"]),accts:()=>named().map(a=>a.name),debts:()=>D.accts.filter(a=>a.type=="부채"&&a.name).map(a=>a.name),ab:()=>L(D.lists.ab),cb:()=>L(D.lists.cb),ao:()=>["자산","부채"],yn:()=>["Y","N"],kd:()=>["카드","대출","기타"],ck:()=>["수입","지출"],tx:()=>["일반","제외","해당없음"],pt:()=>["상환","생활비","저축","수입"],hd:()=>["예","아니오"],meth:()=>["원리금균등","원금균등"],sm3:()=>["원리금균등","원금균등","두 방식 비교"],yrs4:()=>["2026","2027","2028","2029"],pay:()=>["일시불","할부","할부수수료","해외이용","대중교통","전통시장","기타제외"]};
const SEC=[
{id:"accts",t:"2. 계정 (자산·부채 전체)",h:"가진 계좌·카드·대출을 한 줄씩. 시작잔액은 2026-11-03 기준입니다. 버퍼 용도는 메모에 적어 주세요.",c:[["type","구분","sel","ao"],["grp","묶음","sel","ab"],["name","계정명","text"],["bal","시작잔액(원)","money"],["own","명의","sel","names"],["memo","용도·메모","text"],["use","사용","sel","yn"]]},
{id:"loans",t:"3. 대출·카드·기타부채 상세",h:"계정에서 구분을 ‘부채’로 적은 계정만 선택할 수 있습니다.",c:[["name","계정명(부채)","sel","debts"],["kind","종류","sel","kd"],["bal","현재 잔액(원)","money"],["rate","연 금리(%)","num"],["pay","월 원리금(원)","money"],["end","종료 예정월","month"],["day","결제·상환일","num"],["limit","카드 한도(원)","money"],["memo","우대조건·메모","text"]]},
{id:"cats",t:"4. 카테고리 (수입·지출 분류)",h:"대분류 10개 안팎, 소분류는 선택입니다. 카드 공제 제외 여부(할부수수료·해외이용 등)는 거래 입력의 ‘결제구분’에서 지정합니다.",c:[["kind","구분","sel","ck"],["grp","묶음","sel","cb"],["big","대분류","text"],["small","소분류(선택)","text"],["bud","월 예산(원)","money"],["memo","메모","text"]],x:'<button onclick="fillCats()" style="margin-top:6px">✨ 제안안 채우기</button> '}];
const GOAL=[["buy","목표 구입 시점","month"],["ltv","LTV(%)","num"],["cap","대출 상한(원)","money"],["cost","부대비용(%)","num"],["dep","월세보증금 반환액(원)","money"],["ri","ISA·투자 수익률 가정(%/년)","num"],["rs","예금·파킹 이율 가정(%/년)","num"],["raise","연 소득 인상률 가정(%)","num"],["sink","남는 돈을 받을 계정","sel","accts"]];
const BAS=[["name","이름(명의)","text"],["sal","세전 연봉(원)","money"],["bon","세전 성과급(연, 원)","money"],["day","급여일(일)","num"],["bm","성과급 지급월(1~12)","num"],["head","세대주","sel","hd"]];
const CATS=[["지출","고정비","주거비","월세, 공과금, 관리비"],["지출","고정비","보험·통신","보장성 보험, 자동차보험, 통신비"],["지출","고정비","금융비용","대출이자, 할부수수료, 연회비"],["지출","생활 변동비","식비","장보기, 외식·배달, 카페, 점심"],["지출","생활 변동비","생활·쇼핑","생활용품, 쿠팡와우, 가전·가구, 의류·미용"],["지출","생활 변동비","교통·차량","대중교통, 주유, 하이패스, 주차·정비, 세금·과태료"],["지출","생활 변동비","건강","병원·약국, 영양제·마사지, 운동"],["지출","개인·여가","용돈","명의별"],["지출","개인·여가","여가·취미","OTT, 자기계발, 복권, 데이트"],["지출","특별","경조사·이벤트","경조사, 기념일·여행, 이사·행사"],["수입","수입","근로소득","월급, 성과급, 복지비"],["수입","수입","금융소득","이자·캐시백·배당"],["수입","수입","기타수입","환급금, 중고판매, 경조사받음, 보험금"]];
/* ---------- storage ---------- */
let dirty=new Set(),tmr;const setSt=s=>{$("st").textContent=s};
function sched(k){dirty.add(k);try{localStorage.setItem("hf3",JSON.stringify({cfg:D,M,PM}))}catch(e){}clearTimeout(tmr);tmr=setTimeout(flush,700);setSt("저장 중…")}
async function flush(){dirty.clear();setSt("💾 이 기기에 저장됨 "+new Date().toLocaleTimeString("ko-KR")+backupNote())}
async function boot(){let cfg=null;
try{const l=JSON.parse(localStorage.getItem("hf3")||"null");if(l&&l.cfg){cfg=l.cfg;M=l.M||{};PM=l.PM||{}}}catch(e){}
if(cfg)D=Object.assign(DEFC(),cfg);D.sim=D.sim||{plan:{}};D.sim.plan=D.sim.plan||{};D.tax=D.tax||[{},{}];while(D.tax.length<2)D.tax.push({});
if(!L(D.lists.ab).includes("현금"))D.lists.ab=D.lists.ab.replace("입출금","입출금,현금");
D.accts.forEach(a=>{if(a.name&&!a.id)a.id="a"+(D.n++)});
D.cats=D.cats.flatMap(c=>/,/.test(c.small||"")?c.small.split(",").map(x=>Object.assign({},c,{small:x.trim()})):[c]);
D.cats.forEach(c=>{if(c.big=="주거·공과")c.big="주거비";if(c.big=="주거비"&&c.small=="전기·가스·수도")c.small="공과금"});D.cats=D.cats.filter(c=>!(c.big=="주거비"&&c.small=="수리"));
{const sn=new Set();D.cats=D.cats.filter(c=>{if(!c.big&&!c.small)return true;const k=c.kind+"|"+c.big+"|"+c.small;if(sn.has(k))return false;sn.add(k);return true})}
if(D.plan){const p0=D.plan.r||[];if(p0.length&&!Object.keys(PM).some(k=>(PM[k].r||[]).length)){const key=D.plan.m||clamp(new Date().toISOString().slice(0,7));PM[key]={r:p0};sched("p"+key)}delete D.plan;sched("cfg")}
Object.values(M).forEach(a=>a.forEach(t=>{if(t.c=="주거·공과")t.c="주거비";if(t.c=="주거비"&&t.s=="전기·가스·수도")t.s="공과금"}));
if(TAB=="mo"&&!named().length)TAB="cf";
draw();setSt("💾 이 기기에 저장됨"+backupNote());
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}

/* ---------- calc ---------- */
function eff(t,a){const m=+t.m||0;let r=0;if(t.k=="수입"&&t.a==a)r=m;else if(t.k=="지출"&&t.a==a)r=-m;else if(t.k=="이체"){if(t.a==a)r-=m;if(t.to==a)r+=m}return isDebt(a)?-r:r}
const sumM=(a,mon)=>(M[mon]||[]).reduce((x,t)=>x+eff(t,a),0);
function opening(a,mon){const ac=byId(a);let b=+ac.bal||0;Object.keys(M).forEach(k=>{if(k<mon)b+=sumM(a,k)});return b}
/* ---------- generic inputs ---------- */
const opt=(list,v)=>'<option value=""></option>'+list.map(x=>`<option ${x==v?"selected":""}>${esc(x)}</option>`).join("")+(v&&!list.includes(v)?`<option selected>${esc(v)}</option>`:"");
function inp(sec,i,c,v){const[k,l,t,o]=c,d=`data-s="${sec}" data-i="${i}" data-k="${k}"`;
if(t=="sel")return`<select ${d} data-o="${o}">${opt(OS[o](),v)}</select>`;
if(t=="money")return`<input inputmode="numeric" ${d} data-m="1" value="${v?Number(v).toLocaleString("ko-KR"):""}">`;

if(t=="num")return`<input type="number" step="any" ${d} data-n="1" value="${v??""}">`;

function drawCf(){let h=`<div class="c"><h2>1. 기본정보</h2><div class="mu">연말정산 계산에 필요한 최소 정보입니다. 월 실수령은 월별 기록에 수입으로 직접 적습니다.</div><div class="w"><table><tr><th></th><th>명의 1</th><th>명의 2</th></tr>${BAS.map(c=>`<tr><th>${c[1]}</th>${[0,1].map(i=>`<td>${inp("basic",i,c,D.basic[i][c[0]])}</td>`).join("")}</tr>`).join("")}</table></div></div>`;

h+=`<div class="c"><h2>드롭다운 목록 편집</h2><div class="mu">쉼표로 구분해서 수정하면 ‘묶음’ 드롭다운에 반영됩니다.</div><div class="g2"><div><label>계정 묶음</label><input data-s="lists" data-k="ab" value="${esc(D.lists.ab)}"></div><div><label>카테고리 묶음</label><input data-s="lists" data-k="cb" value="${esc(D.lists.cb)}"></div></div></div>`;
$("app").innerHTML=h;sums()}
function sums(){const e=$("sums");if(!e)return;let a=0,b=0;D.accts.forEach(r=>{const v=+r.bal||0;if(r.type=="자산")a+=v;if(r.type=="부채")b+=v});
e.innerHTML=`<div><div class="mu">자산 합계</div><div class="big">${won(a)}</div></div><div><div class="mu">부채 합계</div><div class="big">${won(b)}</div></div><div><div class="mu">순자산</div><div class="big ${a-b<0?"ng":""}">${won(a-b)}</div></div>`}
/* ---------- month nav ---------- */
function monNav(){return`<div class="mn"><button onclick="mv(-1)">◀</button><input type="month" min="${MIN}" max="${MAX}" value="${MON}" onchange="MON=clamp(this.value||MON);draw()"><button onclick="mv(1)">▶</button></div>`}
function mv(d){let[y,m]=MON.split("-").map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}MON=clamp(y+"-"+String(m).padStart(2,"0"));draw()}

function rowsFor(){const T=M[MON]||[];const r=[];T.forEach((t,i)=>{if(SEL=="all"||t.a==SEL)r.push({i,t});else if(t.k=="이체"&&t.to==SEL)r.push({i,t,m:1})});return r}
function drawMo(){const ac=named();if(!ac.length){$("app").innerHTML='<div class="c">먼저 ⚙️ 설정에서 계정을 입력해 주세요.</div>';return}
if(SEL!="all"&&!byId(SEL))SEL="all";
const chip=(v,l)=>`<button class="${SEL==v?"on":""}" onclick="SEL='${v}';draw()">${esc(l)}</button>`;
let h=`${planHtml()}<div class="c"><h2>2. 월별 기록</h2>${monNav()}<div class="mu">계좌를 골라 그 통장의 수입·지출·이체를 적습니다. 이체는 출금 계좌에서 적고 상대계정에 입금 계좌를 고르면 양쪽에 반영됩니다. 카드는 사용하면 부채가 늘고, 카드대금은 자산→카드 이체로 적습니다.</div>
<div class="chips">${chip("all","전체")}${ac.map(a=>chip(a.id,a.name)).join("")}</div>`;
const rs=rowsFor(),all=SEL=="all",bigs=[...new Set(D.cats.map(c=>c.big).filter(Boolean))];
h+=`<div class="k" id="msum"></div><div class="w"><table><tr><th>날짜</th><th>구분</th>${all?"<th>계정</th>":""}<th>분류</th><th>소분류</th><th>내용</th><th>결제구분</th><th class="r">금액(원)</th><th>상대계정(이체)</th><th>메모</th>${all?"":'<th class="r">잔액</th>'}<th></th></tr>`;
const aopt=v=>'<option value=""></option>'+ac.map(a=>`<option value="${a.id}" ${a.id==v?"selected":""}>${esc(a.name)}</option>`).join("");

h+=`<h3 style="margin:14px 0 4px">ISA 절세 효과 (계획 기준, 수익률 ${gv("ri",4)}%)</h3><div class="w"><table><tr><th></th>${[0,1].map(i=>`<th class="r gs">${esc(txName(i))}</th>`).join("")}</tr>${[["월 납입",r=>won(r.I.m)],["유지 기간",r=>r.I.n/12+"년"],["총 납입",r=>won(r.I.pr)],["예상 평가액",r=>won(r.I.fv)],["수익",r=>won(r.I.pf)],["비과세 한도 (총급여 5천 이하 서민형 400만, 그 외 200만)",r=>won(r.I.ex)],["ISA 세금 (초과분 9.9%)",r=>won(r.I.t1)],["일반계좌 세금 (15.4%)",r=>won(r.I.t2)],["<b>ISA 절세액</b>",r=>"<b>"+won(r.I.t2-r.I.t1)+"</b>"]].map(([l,g])=>`<tr><td>${l}</td>${RP.map(r=>`<td class="r gs">${r.I.m?g(r):"–"}</td>`).join("")}</tr>`).join("")}</table></div>`;
const wn=RP.map((r,i)=>r.I.m*12>20000000?esc(txName(i))+"의 연 납입이 2,000만 원을 넘습니다(미납입 한도 이월분 확인). ":"").join("");
h+=`<div class="mu" style="margin-top:6px">${wn}ISA 비과세·9.9% 분리과세는 해지(만기) 시 정산되므로 환급액에는 더하지 않았고, 의무기간(3년) 전 해지하면 혜택이 사라집니다. 국내주식형 ETF의 매매차익은 일반계좌에서도 비과세라 그 비중이 크면 절세액이 과대 계산됩니다. ISA 만기 후 연금계좌 이전 공제는 이전액의 10%(최대 300만 원)로 계산했으며 적용 요건은 확실하지 않으니 신고 전에 확인해 주세요. 수익률은 위 ‘ISA 수익률 가정’ 값을 씁니다.</div>`;
e.innerHTML=h}
/* ---------- tabs / events ---------- */
function draw(){$("tabs").innerHTML=[["mo","✍️ 월별 기록"],["as","🏠 자산현황"],["tx","🧾 연말정산 시뮬레이터"],["sm","🏦 주담대 시뮬레이터"],["cf","⚙️ 설정"]].map(([k,l])=>`<button class="${TAB==k?"on":""}" onclick="TAB='${k}';draw()">${l}</button>`).join("");
({mo:drawMo,as:drawAs,tx:drawTx,sm:drawSm,cf:drawCf})[TAB]()}
function refreshSel(){document.querySelectorAll("select[data-o]").forEach(s=>{if(!OS[s.dataset.o])return;const v=s.value;s.innerHTML=opt(OS[s.dataset.o](),v)})}
function fmtI(el){const s=el.selectionStart,d=el.value.slice(0,s).replace(/\D/g,"").length,n=el.value.replace(/\D/g,"");el.value=n?(+n).toLocaleString("ko-KR"):"";let c=0,q=0;for(;q<el.value.length&&c<d;q++)if(/\d/.test(el.value[q]))c++;try{el.setSelectionRange(q,q)}catch(e){}}
function onEd(e){const t=e.target,s=t.dataset.s;if(!s)return;let v=t.value;if(t.dataset.m){if(e.type=="input")fmtI(t);v=+t.value.replace(/,/g,"")||""}else if(t.dataset.n)v=v===""?"":+v;
const k=t.dataset.k,i=t.dataset.i;
if(s=="plm"){if(v)PLM=clamp(v);drawMo();return}
if(s=="pl"){plRows()[i][k]=v;sched("p"+PLM);updPl();return}
if(s=="plan"){D.sim.plan[k]=v===""?0:v;sched("cfg");updSm();return}
if(s=="tx"){M[MON][i][k]=v;sched(MON);if(k=="c"&&!subsFor(v).includes(M[MON][i].s))M[MON][i].s="";if(e.type=="change"&&(k=="k"||k=="a"||k=="to"||k=="c"))drawMo();else updMo();return}
if(s=="lists")D.lists[k]=v;else if(s=="goal")D.goal[k]=v;else D[s][i][k]=v;
if(s=="accts"&&k=="name"&&v&&!D.accts[i].id)D.accts[i].id="a"+(D.n++);
sched("cfg");if(e.type=="change"&&(s=="accts"||s=="basic"||s=="lists"))refreshSel();if(s=="accts")sums();if(TAB=="sm")updSm();if(TAB=="tx")updTx()}
document.addEventListener("input",onEd);document.addEventListener("change",onEd);
const cfS=()=>{sched("cfg");draw()};
function addR(s){D[s].push({});cfS()}function insR(s,i){D[s].splice(i+1,0,{});cfS()}
function delR(s,i){const r=D[s][i];if(s=="accts"&&r.id&&Object.values(M).some(a=>a.some(t=>t.a==r.id||t.to==r.id))){setSt("⚠️ 거래가 있는 계정은 삭제할 수 없습니다 (‘사용’을 N으로 바꾸세요)");return}D[s].splice(i,1);if(!D[s].length)D[s].push({});cfS()}
function fillCats(){D.cats=D.cats.filter(r=>Object.keys(r).length);CATS.forEach(r=>(r[3]=="명의별"?[""]:r[3].split(",").map(x=>x.trim())).forEach(sm=>D.cats.push({kind:r[0],grp:r[1],big:r[2],small:sm})));const f=D.cats.find(r=>r.big=="금융비용");if(f)f.memo="할부수수료는 거래에서 결제구분 ‘할부수수료’로 지정";cfS()}
/* ---------- export / reset ---------- */
const BK="hf3_bk";
function backupNote(){try{const t=localStorage.getItem(BK);if(!t)return" · ⚠️ 백업 없음";const d=Math.floor((Date.now()-new Date(t))/864e5);return d>=14?" · ⚠️ 마지막 백업 "+d+"일 전":" · 마지막 백업 "+(d<1?"오늘":d+"일 전")}catch(e){return""}}
async function saveFile(name,blob,type){const f=new File([blob],name,{type});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return true}catch(e){if(e&&e.name=="AbortError")return false}}
const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}
async function doBackup(){const o={app:"hf3",v:1,at:new Date().toISOString(),data:{cfg:D,M,PM}},ok=await saveFile("가계부_백업_"+new Date().toISOString().slice(0,10)+".json",new Blob([JSON.stringify(o)],{type:"application/json"}),"application/json");if(ok){try{localStorage.setItem(BK,new Date().toISOString())}catch(e){}setSt("백업 저장 완료"+backupNote())}}
function doRestore(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),d=o.data||o;if(!d.cfg||!d.cfg.accts)throw 0;if(!confirm("현재 앱의 데이터를 백업 파일 내용으로 바꿉니다. 계속할까요?"))return;localStorage.setItem("hf3",JSON.stringify({cfg:d.cfg,M:d.M||{},PM:d.PM||{}}));location.reload()}catch(e){setSt("올바른 백업 파일이 아닙니다")}};r.readAsText(f);el.value=""}
async function doCsv(){const nm=id=>(byId(id)||{}).name||"",q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"',rows=[["날짜","구분","계정","분류","소분류","내용","결제구분","금액","상대계정","메모"]];
Object.keys(M).sort().forEach(k=>M[k].forEach(t=>rows.push([t.d,t.k,nm(t.a),t.c,t.s,t.t,t.k=="지출"?(t.p||"일시불"):"",t.m,nm(t.to),t.n])));
await saveFile("가계부_거래_"+new Date().toISOString().slice(0,10)+".csv",new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"}),"text/csv");setSt("CSV 저장 완료")}
let rsT=0;function doReset(){const b=$("rs");if(!rsT){rsT=1;b.textContent="⚠️ 한 번 더 누르면 모두 지워집니다";setTimeout(()=>{rsT=0;b.textContent="🗑 전체 비우기"},4000);return}
Object.keys(M).forEach(k=>{M[k]=[];sched(k)});Object.keys(PM).forEach(k=>{PM[k]={};sched("p"+k)});D=DEFC();sched("cfg");draw();rsT=0;b.textContent="🗑 전체 비우기"}
boot();
</script></body></html>
